<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Daily updated proxy lists: HTTP, HTTPS, SOCKS4, SOCKS5. Free, fast, and reliable proxies for web scraping, SEO tools, and online anonymity.">
    <meta name="keywords"
          content="proxy list, free proxy servers, HTTP proxies, SOCKS5 proxies, fast proxies, reliable proxies, web scraping, anonymity, updated proxies">
    <meta name="author" content="Fresh Proxy Team">
    <meta name="robots" content="index, follow">
    <title>Fresh Proxy List</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-XXXXX-Y"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'UA-XXXXX-Y');
    </script>
    <script src="static/script.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Arial', sans-serif;
        }

        h2, h4 {
            color: #ff4081;
        }

        .btn-primary {
            background-color: #6200ea;
            border-color: #6200ea;
        }

        .btn-primary:hover {
            background-color: #3700b3;
            border-color: #3700b3;
        }

        .btn-success {
            background-color: #03dac6;
            border-color: #03dac6;
        }

        .btn-success:hover {
            background-color: #018786;
            border-color: #018786;
        }

        .btn-danger {
            background-color: #cf6679;
            border-color: #cf6679;
        }

        .btn-danger:hover {
            background-color: #b00020;
            border-color: #b00020;
        }

        .table-hover thead tr {
            background-color: #1f1f1f;
            color: #e0e0e0;
        }

        .table-hover tbody tr {
            background-color: #2c2c2c;
        }

        .table-hover tbody tr:hover {
            background-color: #333333;
        }

        .form-control {
            background-color: #1f1f1f;
            color: #e0e0e0;
            border: 1px solid #333333;
        }

        .form-control:focus {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #6200ea;
        }

        @media (max-width: 768px) {
            .table-responsive {
                overflow-x: auto;
            }

            .table-hover td {
                font-size: 12px;
            }
        }

        .genre-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .genre-buttons button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #6200ea;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .genre-buttons button:hover {
            background-color: #3700b3;
        }

        .modal-content h3 {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
<div>
    <div class="container">
        <div class="row" style="text-align: center">
            <hr>
            <h2 id="title">Movie Database</h2>
            <a href="https://github.com/vakhov/fresh-proxy-list" style="color: #03dac6;">View on Github</a>
            <h4 id="subtitle">Select movies by genre</h4>
            <hr>
        </div>
        <div class="row" style="text-align: center">
            <button class="btn btn-primary" onclick="show_filme_filter()">Filme filtern</button>
            <button class="btn btn-success" onclick="showAllMovies()">Show All Movies</button>
            <button class="btn btn-danger" onclick="clearMovieData()">Clear Data</button>
            <hr>
        </div>
        
        <!-- Genre Selection Modal -->
        <div id="genreModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4);">
            <div class="modal-content" style="background-color: #2c2c2c; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 500px; border-radius: 5px;">
                <span class="close" onclick="closeGenreModal()" style="color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer;">&times;</span>
                <h3 style="color: #ff4081; margin-bottom: 20px;">Genre auswählen</h3>
                <div id="genreList" class="genre-buttons"></div>
            </div>
        </div>

        <div class="row" id="movieSection" style="display: none;">
            <div class="table-responsive">
                <table class="table table-hover" style="text-align: center">
                    <thead>
                    <tr>
                        <td>#</td>
                        <td>Title</td>
                        <td>Genre</td>
                        <td>Year</td>
                        <td>Director</td>
                        <td>Rating</td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input type="text" placeholder="Search" class="form-control" id="searchTitle" onkeyup="filterMovies()"></td>
                        <td><input type="text" placeholder="Search" class="form-control" id="searchGenre" onkeyup="filterMovies()"></td>
                        <td><input type="text" placeholder="Search" class="form-control" id="searchYear" onkeyup="filterMovies()"></td>
                        <td><input type="text" placeholder="Search" class="form-control" id="searchDirector" onkeyup="filterMovies()"></td>
                        <td><input type="text" placeholder="Search" class="form-control" id="searchRating" onkeyup="filterMovies()"></td>
                    </tr>
                    </thead>
                    <tbody id="movieTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    function exportToCSV() {
        window.open('/fresh-proxy-list/proxylist.csv');
    }
</script>
</body>

</html>
